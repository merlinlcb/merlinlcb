"586" height="30" fill="#050a14" style="animation:reveal 0.50s steps(58) 5.56s forwards"/><g class="last" style="animation:show 0s 6.21s forwards"><text x="34" y="298"><tspan fill="#00ff9f">merlin@lcb</tspan><tspan fill="#d7f7ff" fill-opacity=".5">:</tspan><tspan fill="#00f0ff">~</tspan><tspan fill="#d7f7ff" fill-opacity=".5">$ </tspan></text><rect class="cur" x="173" y="281" width="10" height="20" fill="#00ff9f"/></g>
